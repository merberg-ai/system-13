name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check shell scripts
        run: bash -n scripts/*.sh tools/system13ctl

      - name: Type-check
        run: npm run check

      - name: Validate scenarios
        run: npm run scenarios:validate

      - name: Test engine
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke production daemon
        run: npm run smoke:production
